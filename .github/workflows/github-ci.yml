name: TESTS

on:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['5.3', '5.4', '5.5', '5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php-versions }}

    steps:
    - uses: actions/checkout@v4

    # zlib is needed for the gzipped fixtures, mbstring for the exact lower-casing tests, intl for the ICU guess test
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mbstring, intl, zlib
        ini-values: memory_limit=1G
        coverage: none

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Run tests
      run: vendor/bin/phpunit

  test-32bit:
    # a 32-bit PHP (int is 31 bits wide): timestamps are whole-number floats there
    runs-on: ubuntu-latest
    name: PHP 5.6 (32-bit)

    steps:
    - uses: actions/checkout@v4

    - name: Install PHPUnit
      run: |
        docker run --rm -v "$PWD":/w -w /w -e COMPOSER_NO_SECURITY_BLOCKING=1 composer:2 sh -c "
          git config --global --add safe.directory '*'
          composer self-update --2.2 -q
          composer config platform.php 5.6.99
          composer require --dev phpunit/phpunit:'^5.7' -W --no-interaction --no-progress -q"

    - name: Run tests
      run: docker run --rm -v "$PWD":/w -w /w i386/php:5.6-cli php vendor/bin/phpunit

  fixtures:
    # the golden data must still be what the real moment.js produces: regenerate and compare
    runs-on: ubuntu-latest
    name: Fixtures are current
    # moment-timezone publishes new tz data releases: a failure here means "regenerate", not "broken"
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install moment 2.30.1 + moment-timezone
      run: cd tools && npm install

    - name: Regenerate the time zone data
      run: cd tools && node generate-tzdata.js

    - name: Data matches the committed copy
      run: git diff --exit-code data/
