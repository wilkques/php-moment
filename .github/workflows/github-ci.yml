name: TESTS

on:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # php: the PHP version, phpunit: the PHPUnit constraint that supports it,
        # config: which phpunit-*.xml to use (lower: 5.3-7.0, higher: 7.1-8.0, latest: 8.1+)
        include:
          - { php: '5.3', phpunit: '^4.8', config: lower }
          - { php: '5.4', phpunit: '^4.8', config: lower }
          - { php: '5.5', phpunit: '^4.8', config: lower }
          - { php: '5.6', phpunit: '^5.7', config: lower }
          - { php: '7.0', phpunit: '^6.5', config: lower }
          - { php: '7.1', phpunit: '^7.5', config: higher }
          - { php: '7.2', phpunit: '^8.5', config: higher }
          - { php: '7.3', phpunit: '^9.6', config: higher }
          - { php: '7.4', phpunit: '^9.6', config: higher }
          - { php: '8.0', phpunit: '^9.6', config: higher }
          - { php: '8.1', phpunit: '^10.5', config: latest }
          - { php: '8.2', phpunit: '^11.0', config: latest }
          - { php: '8.3', phpunit: '^12.0', config: latest }
          - { php: '8.4', phpunit: '*', config: latest }

    name: PHP ${{ matrix.php }}

    steps:
    - uses: actions/checkout@v4

    # zlib is needed for the gzipped fixtures, mbstring for the exact lower-casing tests
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: zlib, mbstring
        ini-values: memory_limit=1G
        coverage: none
        tools: composer

    - name: Install PHPUnit
      run: |
        composer config platform.php ${{ matrix.php }}.99
        composer require --dev "phpunit/phpunit:${{ matrix.phpunit }}" -W --no-interaction --no-progress

    - name: Run tests
      run: vendor/bin/phpunit -c phpunit-${{ matrix.config }}.xml

  test-32bit:
    # a 32-bit PHP (int is 31 bits wide): timestamps are whole-number floats there
    runs-on: ubuntu-latest
    name: PHP 5.6 (32-bit)

    steps:
    - uses: actions/checkout@v4

    - name: Install PHPUnit
      run: |
        docker run --rm -v "$PWD":/w -w /w -e COMPOSER_NO_SECURITY_BLOCKING=1 composer:2 sh -c "
          git config --global --add safe.directory '*'
          composer self-update --2.2 -q
          composer config platform.php 5.6.99
          composer require --dev phpunit/phpunit:'^5.7' -W --no-interaction --no-progress -q"

    - name: Run tests
      run: docker run --rm -v "$PWD":/w -w /w i386/php:5.6-cli php vendor/bin/phpunit -c phpunit-lower.xml

  fixtures:
    # the golden data must still be what the real moment.js produces: regenerate and compare
    runs-on: ubuntu-latest
    name: Fixtures are current
    # moment-timezone publishes new tz data releases: a failure here means "regenerate", not "broken"
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install moment 2.30.1 + moment-timezone
      run: cd tools && npm install

    - name: Regenerate the time zone data
      run: cd tools && node generate-tzdata.js

    - name: Data matches the committed copy
      run: git diff --exit-code data/
